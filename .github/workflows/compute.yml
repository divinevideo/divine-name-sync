name: Compute

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: fastly/compute-actions/setup@9ca64d641e165464cd4c0c988f2e549dc7d43b49 # v13
        with:
          cli_version: '16.0.0'
          viceroy_version: '0.22.0'
      - run: fastly compute build --non-interactive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compute-${{ github.sha }}
          path: pkg/divine-name-sync.tar.gz
          if-no-files-found: error

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: fastly-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compute-${{ github.sha }}
          path: pkg
      - name: Deploy checked package and verify production
        run: node scripts/deploy.mjs
        env:
          CD_ENABLED: ${{ vars.FASTLY_CD_ENABLED }}
          FASTLY_CUSTOMER_ID: ${{ vars.FASTLY_CUSTOMER_ID }}
          FASTLY_RESOURCE_IDS: ${{ vars.FASTLY_RESOURCE_IDS }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment.json
          if-no-files-found: warn
